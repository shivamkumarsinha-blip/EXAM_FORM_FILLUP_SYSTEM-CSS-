<!DOCTYPE html>

    <option value="cse">5</option>

    <option value="cse">mid term</option>

</select>

<label for="subjects" class="label">select subjects:</label>
<br/>

<input type="checkbox" id="subject" class="checkbox">

<br/>

<br/>

<input type="checkbox" id="subject" class="checkbox">

<br/>

<input type="file" id="fileselect" class="file-input">
<br/>

<button class="submit-btn">Submit Form</button>
</body>
</html>
