<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="student_login_page_css.css">
    
</head>
<body>
    <div class="container">
        <h1 class="title">LOGIN</h1>
        <br/>

        <label for="email" class="label">EMAIL:</label>
        <br/>
        <input type="email" id="email" class="input-field" placeholder="abc@gmail.com">
        <br/>

        <label for="verify" class="label">PASSWORD:</label>
        <br/>
        <input type="password" id="verify" class="input-field" placeholder="password">
        <br/>

        <button class="login-btn">Login</button>
        <br/>

        <p class="register-text">
            Don't have an account? 
            <button class="register-btn">Register here</button>
        </p>
    </div>
</body>
</html>
