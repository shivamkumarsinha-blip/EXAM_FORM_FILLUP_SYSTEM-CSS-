<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="student_register_page_css.css">
</head>
<body>
    <div class="container">
    <h1 class="title">REGISTER</h1>
    <br/>

    <label for="name" class="label">NAME:</label>
    <input type="text" id="name" class="input-field" placeholder="name">
    <br/>

    <label for="email" class="label">EMAIL:</label>
    <input type="email" id="email" class="input-field" placeholder="abc@gmail.com">
    <br/>

    <label for="lock" class="label">PASSWORD:</label>
    <input type="password" id="lock" class="input-field" placeholder="password">
    <br/>

    <label for="roll" class="label">ROLL NO:</label>
    <input type="text" id="roll" class="input-field">
    <br/>

    <label for="stream" class="label">COURSE:</label>
    <select name="course" id="stream" class="select-field">
        <option value="" disabled selected>choose</option>
        <option value="cse">CSE</option>
        <option value="it">IT</option>
        <option value="ece">ECE</option>
        <option value="aiml">AIML</option>
        <option value="me">MECHANICAL</option>
        <option value="ee">ELECTRICAL</option>
        <option value="civil">CIVIL</option>
    </select>
    <br/>

    <label for="sem" class="label">SEMESTER:</label>
    <select name="semester" id="sem" class="select-field">
        <option value="" disabled selected>choose</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
    </select>
    <br/>

    <button class="register-btn">Register</button>
    <br/>

    <p class="login-text">Already have an account? <button class="login-link-btn">Login here</button></p>
</div>
</body>
</html>
